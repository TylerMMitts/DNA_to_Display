# Makes the repo runnable with one command on a machine that has nothing:
#
#   uv run code/preflight.py
#
# uv reads this file, builds an environment matching it, and runs the script.
# No venv to create, no activate step, no conda. requirements.txt is kept in
# sync for anyone who would rather use pip.

[project]
name = "dna-to-display"
version = "0.1.0"
description = "Genotype-conditioned latent diffusion over maize root cross-sections"
requires-python = ">=3.10"

dependencies = [
    # Core numerics and data handling.
    "numpy>=1.21.0",
    "pandas>=1.3.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.0.0",   # PCA behind the SNP encoding
    "pyarrow>=10.0.0",       # pandas reads the SNP matrix from .parquet

    # Deep learning. 2.0 is the floor because pick_device() asks for the MPS
    # backend and the checkpoint loaders pass weights_only, neither of which
    # exists in 1.x.
    "torch>=2.0.0",
    "torchvision>=0.15.0",

    # Image handling and the models built on it.
    "Pillow>=8.0.0",
    "opencv-python>=4.5.0",  # root detection in crop_root_model.py
    "scikit-image>=0.19.0",  # watershed vessel splitting
    "PyWavelets>=1.3.0",     # LiteVAE's wavelet transform
    "ultralytics>=8.0.0",    # YOLOv8 detection and segmentation

    # Figures and progress bars.
    "matplotlib>=3.5.0",
    "tqdm>=4.60.0",

    # Perceptual similarity metric. Only code/litevae/evaluation/test_litevae.py
    # imports it, but it is a plain dependency rather than an extra so that
    # script does not die on import for someone who installed everything.
    "lpips>=0.1.4",
]

[tool.uv]
# There is nothing here to build or install - the repo is a set of scripts, not
# a library - so uv manages the environment without packaging the project.
package = false

# Windows wheels on PyPI are CPU-only. Pointing just that platform at PyTorch's
# CUDA index is what stops the classic failure where a box with a good NVIDIA
# card reports torch.cuda.is_available() == False and quietly trains on the CPU.
# macOS gets MPS from the ordinary wheel; Linux wheels on PyPI already carry CUDA.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
torchvision = [{ index = "pytorch-cu124", marker = "sys_platform == 'win32'" }]
